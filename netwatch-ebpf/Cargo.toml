[package]
name = "netwatch-ebpf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "netwatch's in-kernel eBPF program"

[dependencies]
netwatch-common = { path = "../netwatch-common" }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-ebpf-bindings = { version = "0.2.0", default-features = false }

[build-dependencies]
which = { version = "6.0", default-features = false }

[[bin]]
name = "netwatch"
path = "src/main.rs"
